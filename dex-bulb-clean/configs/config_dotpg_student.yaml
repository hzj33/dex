# DOTPG 学生模型训练主配置文件（student-state：不使用特权信息作为 policy 输入）
#
# - 训练时仍需要 PPO teacher ckpt（用于采集专家动作 + 监督预热 proprio-adapt 表征）
# - policy 输入与原项目 ProprioAdapt 学生一致：obs + proprio_hist->extrin_pred

task_name: ${task.name}
experiment: 'dotpg_student_student_state'

num_envs: ''
seed: 42

physics_engine: 'physx'
pipeline: 'gpu'
sim_device: 'cuda:0'
rl_device: 'cuda:0'
graphics_device_id: 7

num_threads: 4
solver_type: 1
num_subscenes: 0

test: False
checkpoint: ''   # PPO teacher checkpoint（必须提供）
headless: False

wandb_activate: True
wandb_group: 'dotpg'
wandb_name: ${experiment}
wandb_entity: ''
wandb_project: 'dexscrew_dotpg'

defaults:
  - _self_
  - task: XHandHoraScrewDriver
  - train: XHandHoraScrewDriver_DOTPG_Student
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

