name: RBHandHoraLightbulb
physics_engine: 'physx'
on_evaluation: False
eval_cache_name: debug

env:
  # Reuse existing reset/object placement logic (in code paths keyed by this string)
  initPose: 'screwdriver_inclined'
  numEnvs: 1
  numActions: 12
  envSpacing: 0.5

  episodeLength: 800
  aggregateMode: 1

  # Controller (keep consistent with existing tasks)
  controller:
    torque_control: True
    controlFrequencyInv: 10  # 20Hz
    pgain: 3
    dgain: 0.01
    action_scale: 0.05
    torque_limit: 300.0

  # Optional: use one action dim as a kinematic wrist yaw around the bulb axis.
  # Default disabled so existing debug/vis scripts keep the same behavior; training scripts enable it explicitly.
  wrist:
    enable: False
    action_index: 0
    # Negative means: positive action -> clockwise (装配) around +Z.
    yaw_scale: -0.05
    limit_deg: 25.0
    smooth: True
    pivot_mode: nut_pos
    write_to_obs: True

  rotation_axis: '+z'

  clipObservations: 5.0
  clipActions: 1.0

  # RBHand + new object may start farther away; relax the reset threshold to avoid instant resets.
  reset_dist_threshold: 0.20
  reset_z_threshold: 0.0

  # Disable XHand-specific action masking.
  apply_action_mask: False

  # Debug-friendly termination (for stable visualization). For training, consider turning these back on.
  termination:
    grace_steps: 50
    enable_finger_dist: False
    enable_nut_stagnation: False
    enable_no_contact: False
    enable_screw_limit: False
    log: False

  forceScale: 2.0
  randomForceProbScalar: 0.25
  forceDecay: 0.9
  forceDecayInterval: 0.08

  hora:
    propHistoryLen: 30
    point_cloud_sampled_dim: 100

  reward:
    angvelClipMin: -4.0
    angvelClipMax: 4.0
    angvelPenaltyThres: [7.5, 15.0, 30000000, 60000000]
    rotate_reward_scale: 2.5
    pose_diff_penalty_scale: -0.1
    torque_penalty_scale: -3.0
    work_penalty_scale: -0.01
    rotate_penalty_scale: -0.3
    pc_z_dist_penalty_scale: -1.0
    proximity_reward_scale: 2.0
    # Soft constraint: encourage thumb + (index or middle) to grasp while rotating.
    # This is RBHand-specific and disabled by default in code.
    two_finger_gate:
      enable: True
      # fingertipBodies order is: index, middle, pinky, ring, thumb
      thumb_fingertip_index: 4
      other_fingertip_indices: [0, 1]
      target: nut_pos
      # Move the target point up along +Z to the bulb head region.
      target_offset: [0.0, 0.0, 0.06]
      # Distances (meters): <=near => full, >=far => 0; linearly interpolated in between.
      near: 0.07
      far: 0.11
      # Keep a small fraction of positive rotate reward even without full gate.
      min_mult: 0.05
      power: 1.0
      scale_with_object: True
      apply_positive_vel_only: True
      use_contact_force: True
      contact_force_min: 0.5
      contact_force_max: 2.0
      # Penalize positive rotation when not grasping with 2 fingers (set 0 to disable).
      no_grasp_penalty_scale: -1.0

  baseObjScale: 1.0
  randomization:
    randomizeMass: True
    randomizeMassLower: 0.04
    randomizeMassUpper: 0.06
    randomizeCOM: True
    randomizeCOMLower: -0.001
    randomizeCOMUpper: 0.001
    randomizeFriction: True
    randomizeFrictionLower: 0.5
    randomizeFrictionUpper: 8.0
    randomizeScale: True
    randomize_hand_scale: False
    scaleListInit: True
    # RBHand + lightbulb is more sensitive to object size; keep scale range tighter to avoid initial interpenetration.
    randomizeScaleList: [0.90, 0.95, 1.0, 1.05, 1.10]
    randomizeScaleLower: 0.90
    randomizeScaleUpper: 1.10
    randomizePDGains: True
    randomizePGainLower: 2.7
    randomizePGainUpper: 3.3
    randomizeDGainLower: 0.009
    randomizeDGainUpper: 0.011
    obs_noise_e_scale: 0.01
    obs_noise_t_scale: 0.005
    pose_noise_scale: 0
    action_noise_e_scale: 0.01
    action_noise_t_scale: 0.005
    noisy_rpy_scale: 0.1
    noisy_pos_scale: 0.02

  privInfo:
    enableObjPos: True
    enableObjScale: True
    enableObjMass: True
    enableObjCOM: True
    enableObjFriction: True
    enable_obj_restitution: True
    enable_tactile: False
    contact_input_dim: 4
    contact_form: 'gpu_contact'
    contact_input: 'binary'
    contact_binarize_threshold: 0.1
    enable_obj_orientation: True
    enable_obj_linvel: True
    enable_obj_angvel: True
    enable_ft_pos: True
    enable_ft_orientation: True
    enable_ft_linvel: True
    enable_ft_angvel: True
    enable_hand_scale: True
    enable_nut_contact: True
    enable_nut_pos: True
    enable_nut_dof_vel: True
    enable_nut_dof_pos: True
    enable_screw_joint_friction: True
    enable_hand_position: False
    enable_hand_orientation: False
    enable_hand_joint_pos: False
    enable_pgain: False
    enable_dgain: False

  object:
    # Use existing "screw" loading path; put the lightbulb URDF under assets/screw/lightbulb/
    type: 'screw_lightbulb'
    evalObjectType: null
    sampleProb: [1.0]
    nut_termination_history_len: 60
    nut_stagnation_eps: 0.003
    screw_upper_limit: 628.3185
    thumb_range_limit: False
    object_tilt: False
    # Smooth shading in the viewer (load-time only)
    mesh_normal_mode: compute_per_vertex
    # Spawn position for RBHand demo (override the XHand-tuned defaults in code)
    init_pos: [0.0, 0.0, 0.0]
    init_pos_noise: [0.005, 0.005, 0.0]

  asset:
    # NOTE: IsaacGym's asset loader can mis-detect file extensions if there is a '.' in parent folder names.
    # Use a dot-free copy of the same URDF folder.
    handAsset: "assets/RBHand_right/RBHand_right_urdf_v1_2/urdf/arm_right1.urdf"
    # Smooth shading in the viewer (load-time only)
    mesh_normal_mode: compute_per_vertex
    # fingertip bodies (order matters): index, middle, pinky, ring, thumb
    fingertipBodies: ["l6", "l8", "l12", "l10", "l4"]
    # Override the root pose randomization used by XHand (RBHand has a different base orientation)
    handRootQuat: [0.0, 0.0, 0.0, 1.0]
    # NOTE: RBHand URDF has an internal base offset; this root pose puts the fingertips near the lightbulb (origin).
    handRootPos: [0.134, 0.028, 0.14]
    # When randomizeScale is enabled, large bulbs can start intersecting the fixed hand root pose.
    # Compensate by lifting the hand in proportion to (obj_scale - 1). Set to 0 to disable.
    handRootPosZScaleComp: 0.06
    # hand joint init pose by DOF name (must cover all DOFs in the asset)
    handInitPose:
      j_00: 0.0
      j2: -0.75
      j3: 0.75
      j4: 0.20
      j5: 0.70
      j6: 0.70
      j7: 0.70
      j8: 0.70
      j9: 0.70
      j10: 0.70
      j11: 0.70
      j12: 0.70

  enableCameraSensors: False

  # Viewer camera (only used when headless=False)
  viewer:
    camera_pos: [0.35, -0.25, 0.18]
    camera_target: [0.0, 0.0, 0.06]
    # Debug helper: draw a solid local coordinate frame on the rotating part (nut) to make rotation obvious.
    draw_axes: True
    axes_frame: nut
    axis_length: 0.10
    axis_thickness: 0.015
    axis_offset: [0.0, 0.0, 0.06]

sim:
  dt: 0.005
  substeps: 1
  up_axis: 'z'
  use_gpu_pipeline: True
  gravity: [0.0, 0.0, -9.81]
  physx:
    num_threads: 4
    solver_type: 1
    use_gpu: True
    num_position_iterations: 8
    num_velocity_iterations: 0
    max_gpu_contact_pairs: 8388608
    num_subscenes: 0
    contact_offset: 0.002
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1000.0
    default_buffer_size_multiplier: 5.0
    contact_collection: 1
