# DOTPG学生模型训练主配置文件
# 基于论文 "Bridging the Reality Gap: Dual Optimal Transport Policy Gradient"

# Task name - used to pick the class to load
task_name: ${task.name}
experiment: 'dotpg_student'

# if set to positive integer, overrides the default number of environments
num_envs: ''

# seed - set to -1 to choose random seed
seed: 42

## Device config
#  'physx' or 'flex'
physics_engine: 'physx'
# whether to use cpu or gpu pipeline
pipeline: 'gpu'
# device for running physics simulation
sim_device: 'cuda:0'
# device to run RL
rl_device: 'cuda:0'
graphics_device_id: 7  # Determine via vulkaninfo.

## PhysX arguments
num_threads: 4 # Number of worker threads per scene used by PhysX - for CPU PhysX only.
solver_type: 1 # 0: pgs, 1: tgs
num_subscenes: 0 # Splits the simulation into N physics scenes and runs each one in a separate thread

# RLGames Arguments
# test - if set, run policy in inference mode (requires setting checkpoint to load)
test: False
# used to set checkpoint path (教师模型检查点)
checkpoint: ''

# disables rendering
headless: False

# wandb配置
wandb_activate: True
wandb_group: 'dotpg'
wandb_name: ${experiment}
wandb_entity: ''
wandb_project: 'dexscrew_dotpg'

# set default task and default training config based on task
defaults:
  - _self_
  - task: XHandHoraScrewDriver
  - train: XHandHoraScrewDriver_DOTPG  # 使用DOTPG配置
  - override hydra/job_logging: disabled

# set the directory where the output files get saved
hydra:
  output_subdir: null
  run:
    dir: .
