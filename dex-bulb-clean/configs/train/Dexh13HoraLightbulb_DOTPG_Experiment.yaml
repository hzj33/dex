# DOTPG 消融实验配置（Dexh13 + lightbulb，student-state：不使用触觉/特权信息作为 policy 输入）
#
# 目标：让 DOTPG 的 policy 输入对齐原项目学生（ProprioAdapt）：
#   obs + proprio_hist -> extrin_pred
# 训练时仍需要 PPO teacher ckpt：
# - 采集离线 expert buffer（teacher action）
# - 监督预热 proprio-adapt 表征（proprio_hist -> teacher extrin_gt）

seed: ${..seed}
algo: DOTPGExperiment

network:
  mlp:
    units: [512, 256, 128]
  priv_mlp:
    units: [256, 128, 8]
  point_mlp:
    units: [32, 32, 32]

load_path: ${..checkpoint}  # teacher ckpt

ppo:
  output_name: 'dotpg_exp_dexh13_lightbulb_full'
  normalize_input: True
  normalize_value: True
  normalize_priv: True
  normalize_point_cloud: True
  value_bootstrap: True
  num_actors: ${...task.env.numEnvs}
  gamma: 0.99
  tau: 0.95
  learning_rate: 5e-3
  kl_threshold: 0.02
  horizon_length: 12
  minibatch_size: 16384
  mini_epochs: 5
  clip_value: True
  critic_coef: 4
  entropy_coef: 0.0
  e_clip: 0.2
  bounds_loss_coef: 0.0
  truncate_grads: True
  grad_norm: 1.0
  save_best_after: 0
  save_frequency: 500
  max_agent_steps: 10000000000
  priv_info: True
  use_point_cloud_info: True
  proprio_len: 30
  proprio_dim: 32
  proprio_adapt: True

dotpg:
  # 可选: full / no_lipschitz / no_dual_value / no_proprio_hist
  ablation: full
  use_proprio_hist: True
  use_dual_value: True
  use_q_value: True
  use_spectral_norm: True
  use_gradient_penalty: True

  state_mode: student
  dynamic_state: True
  replay_buffer_device: cpu
  replay_buffer_dtype: float16

  gamma: 0.99
  lambda_gp: 10.0
  tau: 0.005

  lr_dual: 1e-4
  lr_q: 1e-4
  lr_policy: 3e-5

  batch_size: 2048

  buffer_size: 500000
  expert_buffer_size: 500000

  expert_buffer_device: cpu
  expert_buffer_dtype: float16
  expert_add_num_envs: 512
  auto_expert_buffer_size: True
  max_auto_expert_buffer_size: 8000000

  reuse_expert_buffer: True

  dual_updates_per_iter: 10
  policy_delay: 10
  hidden_dim: 256

  target_policy_noise: 0.1
  target_noise_clip: 0.2
  use_huber_q_loss: True

  bc_coef: 10.0
  bc_pretrain_steps: 20000
  bc_pretrain_lr: 3e-4
  bc_alpha_min: 1.0
  bc_alpha_max: 200.0

  exploration_noise: 0.005

  dual_use_current_policy_actions: True
  dual_policy_noise: 0.0

  normalize_dual_reward: True
  dual_reward_clip: 5.0
  dual_reward_scale: 1.0

  online_expert: True

  adapt_warmup_steps: 4000
  adapt_warmup_lr: 3e-4
  adapt_latent_coef: 1.0
  adapt_action_bc_coef: 1.0
  freeze_adapt_after_warmup: False
  freeze_sa_mean_std_after_warmup: False

  warmup_steps: 4000
